<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 440" role="img" aria-label="Retro illustration of a kid skiing in goggles and a pom hat">
  <g fill="none" stroke="#3B2416" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== poles (behind the body) ===== -->
    <g stroke-width="7">
      <path d="M124 238 L72 362"/>
      <path d="M70 340 l22 11"/>
      <path d="M256 224 L306 340"/>
      <path d="M294 320 l22 11"/>
    </g>

    <!-- ===== arms (tucked under the jacket) ===== -->
    <g fill="#F0A828">
      <rect x="-15" y="0" width="30" height="76" rx="15" transform="translate(134,196) rotate(16)"/>
      <rect x="-15" y="0" width="30" height="80" rx="15" transform="translate(226,192) rotate(-34)"/>
    </g>

    <!-- ===== skis ===== -->
    <g fill="#E2582C">
      <path d="M30 332 H250 C276 332 303 322 323 302 C329 296 337 304 331 311 C312 333 288 350 258 350 H30 a9 9 0 0 1 0 -18 Z"/>
      <path d="M18 356 H238 C264 356 291 346 311 326 C317 320 325 328 319 335 C300 357 276 374 246 374 H18 a9 9 0 0 1 0 -18 Z"/>
    </g>
    <g stroke="#F7EFE0" stroke-width="4">
      <path d="M186 341 H246"/>
      <path d="M174 365 H234"/>
    </g>

    <!-- ===== snow spray at the tails ===== -->
    <g fill="#F7EFE0">
      <path d="M56 358 q-20 -12 -34 -2 q-16 -6 -20 8 q-13 5 -4 16 q27 10 58 1 q15 -13 0 -23 Z"/>
      <circle cx="26" cy="326" r="10"/>
      <circle cx="54" cy="312" r="6.5"/>
    </g>

    <!-- ===== legs ===== -->
    <g fill="#0E2B35">
      <path d="M124 236 q-18 36 -14 84 h60 q-6 -48 6 -84 Z"/>
      <path d="M198 236 q12 30 12 60 h58 q-4 -32 -10 -60 Z"/>
    </g>

    <!-- ===== boots ===== -->
    <g fill="#3B2416">
      <path d="M104 316 h64 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 h-72 a10 10 0 0 1 -10 -10 v-12 Z"/>
      <path d="M196 292 h60 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 h-68 a10 10 0 0 1 -10 -10 v-12 Z"/>
    </g>
    <g stroke="#F0A828" stroke-width="4.5">
      <path d="M100 332 h74"/>
      <path d="M192 308 h70"/>
    </g>

    <!-- ===== jacket ===== -->
    <path d="M116 190 q2 -36 32 -42 h64 q30 6 32 42 v46 q0 20 -22 20 h-84 q-22 0 -22 -20 Z" fill="#F0A828"/>
    <path d="M118 208 l62 -18 l62 18" stroke="#A8321C" stroke-width="16" stroke-linecap="butt"/>
    <path d="M118 208 l62 -18 l62 18" stroke-width="3.5"/>
    <path d="M118 224 l62 -18 l62 18" stroke-width="3.5"/>
    <path d="M117 238 h128" stroke-width="4"/>

    <!-- ===== mitts ===== -->
    <g fill="#A8321C">
      <ellipse cx="111" cy="272" rx="19" ry="17"/>
      <ellipse cx="272" cy="262" rx="19" ry="17"/>
    </g>

    <!-- ===== scarf ===== -->
    <g fill="#A8321C">
      <path d="M146 166 q34 18 70 0 q10 16 -6 26 q-30 12 -60 0 q-14 -10 -4 -26 Z"/>
      <path d="M150 178 q-40 2 -60 26 q-14 17 -2 26 q14 9 22 -8 q11 -21 34 -22 Z"/>
    </g>

    <!-- ===== head ===== -->
    <circle cx="180" cy="100" r="58" fill="#EFE1C8"/>
    <g stroke="none">
      <circle cx="142" cy="126" r="9.5" fill="#E2582C" opacity=".75"/>
      <circle cx="218" cy="126" r="9.5" fill="#E2582C" opacity=".75"/>
    </g>
    <path d="M163 132 q17 17 34 0" stroke-width="5"/>

    <!-- goggles -->
    <path d="M114 84 q-11 5 -10 13" stroke-width="10" stroke="#17414F"/>
    <path d="M246 84 q11 5 10 13" stroke-width="10" stroke="#17414F"/>
    <path d="M124 66 h112 a14 14 0 0 1 14 14 v16 a16 16 0 0 1 -16 16 h-108 a16 16 0 0 1 -16 -16 v-16 a14 14 0 0 1 14 -14 Z" fill="#17414F"/>
    <path d="M133 76 h94 a7 7 0 0 1 7 7 v13 a8 8 0 0 1 -8 8 h-92 a8 8 0 0 1 -8 -8 v-13 a7 7 0 0 1 7 -7 Z" fill="#F0A828"/>
    <g stroke="#F7EFE0" stroke-linecap="butt">
      <path d="M146 100 l20 -20" stroke-width="7"/>
      <path d="M164 100 l20 -20" stroke-width="4.5"/>
    </g>

    <!-- hat -->
    <path d="M120 62 q4 -54 60 -54 q56 0 60 54 Z" fill="#E2582C"/>
    <path d="M112 44 h136 a11 11 0 0 1 11 11 v6 a11 11 0 0 1 -11 11 h-136 a11 11 0 0 1 -11 -11 v-6 a11 11 0 0 1 11 -11 Z" fill="#F7EFE0"/>
    <circle cx="180" cy="12" r="17" fill="#F7EFE0"/>
  </g>
</svg>
